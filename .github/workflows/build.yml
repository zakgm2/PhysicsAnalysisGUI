name: Build Executables (Windows + macOS)

# Runs when you push a version tag, e.g.:
#   git tag v2.11.0
#   git push origin v2.11.0
# Builds a native PyInstaller executable on each OS separately - it
# can't cross-compile, has to actually run on the target OS - and
# attaches both as assets on a GitHub Release for that tag.
#
# PhysicsAnalysis.spec builds onefile mode, so Windows produces a single
# dist/PhysicsAnalysis.exe directly - no zip step needed there. macOS
# still needs zipping: a .app is inherently a directory bundle (that's
# just how Mac apps work), independent of onefile vs onedir.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:  # manual "Run workflow" button, for testing without a tag

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: PhysicsAnalysis-windows.exe
          - os: macos-latest
            asset_name: PhysicsAnalysis-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # PhysicsAnalysis.spec looks for physicsanalysis_qt/assets/icon.icns
      # and falls back to no icon if it's missing (see the spec's own
      # comment) - built here from icon.png since .icns can only be
      # created with macOS's own iconutil, and there's no Mac available
      # to do this locally. Source is only 192x192, so the largest
      # (1024x1024) iconset entries are just upscaled and will look soft -
      # replace icon.png with a higher-res source (512x512+) to fix that.
      - name: Generate macOS .icns from icon.png
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          sips -z 16 16     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 physicsanalysis_qt/assets/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o physicsanalysis_qt/assets/icon.icns

      - name: Build with PyInstaller
        run: pyinstaller PhysicsAnalysis.spec

      - name: Rename build (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item -Path dist/PhysicsAnalysis.exe -NewName ${{ matrix.asset_name }}
        shell: pwsh

      - name: Zip the build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} PhysicsAnalysis.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ runner.os == 'Windows' && format('dist/{0}', matrix.asset_name) || matrix.asset_name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.os == 'Windows' && format('dist/{0}', matrix.asset_name) || matrix.asset_name }}
